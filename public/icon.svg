<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base -->
  <rect width="512" height="512" rx="115" fill="#121212" />
  <rect x="4" y="4" width="504" height="504" rx="113" fill="none" stroke="#26262B" stroke-width="4" />

  <g transform="translate(0, 0)">
    <!-- Sub-surface Grid -->
    <line x1="102" y1="256" x2="410" y2="256" stroke="#2A2A2E" stroke-width="3" stroke-dasharray="10 10" />
    <line x1="256" y1="102" x2="256" y2="410" stroke="#2A2A2E" stroke-width="3" stroke-dasharray="10 10" />

    <!-- Tilted Central Diamond Node -->
    <polygon points="256,140 371,256 256,371 141,256" fill="#F5F5F7" />
    <polygon points="256,140 371,256 256,256 141,256" fill="#D2D2D6" opacity="0.6" />

    <!-- Orbital Trajectory Ring -->
    <ellipse cx="256" cy="256" rx="169" ry="56" transform="rotate(-25 256 256)" stroke="#E85A71" stroke-width="12" fill="none" opacity="0.4" />
    <ellipse cx="256" cy="256" rx="169" ry="56" transform="rotate(-25 256 256)" stroke="#E85A71" stroke-width="7" stroke-dasharray="30 20" fill="none" />
    
    <!-- Foreground Trajectory Arc -->
    <path d="M 107 287 A 169 56 0 0 0 363 302" transform="rotate(-25 256 256)" stroke="#E85A71" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Central Glowing Core -->
    <circle cx="256" cy="256" r="25" fill="#E85A71" filter="url(#glow-pink)" />
    <circle cx="256" cy="256" r="10" fill="#F5F5F7" />
  </g>
</svg>
