<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow-pink-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crisp Light Canvas Base -->
  <rect width="512" height="512" rx="115" fill="#FFFFFF" />
  <rect x="4" y="4" width="504" height="504" rx="113" fill="none" stroke="#E2E2E6" stroke-width="4" />

  <g transform="translate(0, 0)">
    <!-- Sub-surface Studio Alignment Grid -->
    <line x1="102" y1="256" x2="410" y2="256" stroke="#E2E2E6" stroke-width="3" stroke-dasharray="10 10" />
    <line x1="256" y1="102" x2="256" y2="410" stroke="#E2E2E6" stroke-width="3" stroke-dasharray="10 10" />

    <!-- Sharp Obsidian Diamond Core Node -->
    <polygon points="256,140 371,256 256,371 141,256" fill="#18181B" />
    <polygon points="256,140 371,256 256,256 141,256" fill="#3F3F46" opacity="0.4" />

    <!-- Orbital Trajectory Ring -->
    <ellipse cx="256" cy="256" rx="169" ry="56" transform="rotate(-25 256 256)" stroke="#E11D48" stroke-width="12" fill="none" opacity="0.3" />
    <ellipse cx="256" cy="256" rx="169" ry="56" transform="rotate(-25 256 256)" stroke="#E11D48" stroke-width="7" stroke-dasharray="30 20" fill="none" />
    
    <!-- Foreground Trajectory Arc -->
    <path d="M 107 287 A 169 56 0 0 0 363 302" transform="rotate(-25 256 256)" stroke="#E11D48" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Glowing Rose/Pink Central Core -->
    <circle cx="256" cy="256" r="25" fill="#E11D48" filter="url(#glow-pink-light)" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
  </g>
</svg>
